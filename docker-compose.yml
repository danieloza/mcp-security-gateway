services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      MSG_DATABASE_URL: sqlite:////app/data/mcp_security_gateway.db
      MSG_REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data:/app/data
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
