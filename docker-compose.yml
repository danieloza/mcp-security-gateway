services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MSG_ENVIRONMENT: local
      MSG_DATABASE_URL: sqlite:////app/data/mcp_security_gateway.db
      MSG_REDIS_URL: redis://redis:6379/0
      MSG_ALLOWED_HOSTS: 127.0.0.1,localhost
      MSG_ALLOWED_ORIGINS: http://127.0.0.1:8000,http://localhost:8000
    volumes:
      - gateway-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Local OAuth demo only: `docker compose --profile oauth up keycloak`.
  # The realm, its users and their passwords are public fixtures, like the
  # static demo keys. Tokens are fetched with the password grant of a public
  # client, which is acceptable for a scripted local demo and nothing else.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.5
    profiles: ["oauth"]
    command: ["start-dev", "--import-realm", "--hostname=http://127.0.0.1:8081"]
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./deploy/keycloak/gateway-realm.json:/opt/keycloak/data/import/gateway-realm.json:ro
    security_opt:
      - no-new-privileges:true

volumes:
  gateway-data:
