<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MCP Security Gateway Health</title>
    <style>
      html, body {
        min-height: 100%;
        width: 100%;
        background:
          radial-gradient(circle at 10% 16%, rgba(56, 189, 248, .18), transparent 26%),
          linear-gradient(160deg, #08111e 0%, #10233f 52%, #132b4b 100%);
      }
      body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        color: #eef6ff;
      }
      .wrap { min-height: 100vh; width: 100%; margin: 0; padding: 24px; box-sizing: border-box; }
      .panel { background: rgba(10, 24, 44, .88); border: 1px solid rgba(125,211,252,.18); border-radius: 28px; padding: 36px; box-shadow: 0 20px 80px rgba(0,0,0,.35); }
      .eyebrow { color: #7dd3fc; text-transform: uppercase; letter-spacing: .12em; font-size: 12px; }
      h1 { margin: 10px 0 24px; font-size: clamp(52px, 6vw, 86px); line-height: 1.03; }
      .grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 14px; }
      .card { background: rgba(5,16,31,.76); border: 1px solid rgba(125,211,252,.12); border-radius: 20px; padding: 20px; min-height: 118px; box-sizing: border-box; }
      .label { color: #9cb4cc; font-size: 13px; margin-bottom: 8px; }
      .value { font-size: 34px; font-weight: 700; }
      .ok { color: #4ade80; }
      @media (max-width: 980px) {
        .wrap { padding: 14px; }
        .panel { padding: 24px; }
        .grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
        .value { font-size: 28px; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="panel">
        <div class="eyebrow">Health Snapshot</div>
        <h1>MCP Security Gateway is live</h1>
        <div class="grid">
          <div class="card"><div class="label">Service</div><div class="value">gateway</div></div>
          <div class="card"><div class="label">Database</div><div class="value">sqlite</div></div>
          <div class="card"><div class="label">Rate limit</div><div class="value">memory</div></div>
          <div class="card"><div class="label">Status</div><div class="value ok">healthy</div></div>
          <div class="card"><div class="label">Users</div><div class="value">3</div></div>
          <div class="card"><div class="label">Servers</div><div class="value">3</div></div>
          <div class="card"><div class="label">Requests</div><div class="value">3</div></div>
          <div class="card"><div class="label">Incidents</div><div class="value">1</div></div>
        </div>
      </div>
    </div>
  </body>
</html>
