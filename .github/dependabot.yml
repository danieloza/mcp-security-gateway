version: 2

# Every ecosystem waits 7 days after a release before proposing it, so a
# malicious or broken version has time to be found and pulled first.
updates:
  # Python dependencies from pyproject.toml, in one weekly pull request.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]

  # Workflow actions are pinned to commit SHAs, so they never update on their own.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # The Dockerfile's base image. Moving to another Python minor version is a
  # deliberate change, so only updates within the current one are proposed.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Redis and Keycloak in docker-compose.yml. Major versions are left to a person:
  # Redis 8 changes the licence, and Keycloak majors change the realm format.
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
